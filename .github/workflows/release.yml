name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: keke
  # Must match the channel in rust-toolchain.toml.
  RUST_CHANNEL: "1.96.0"

permissions:
  contents: write

jobs:
  tag-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          [[ "$tag_ver" == "$cargo_ver" ]] \
            || { echo "::error::Tag $tag_ver != Cargo.toml $cargo_ver"; exit 1; }

  build:
    needs: tag-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            npm-dir: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            npm-dir: linux-arm64
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-dir: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-dir: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-dir: win32-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, so the target has to be added to
      # *that* toolchain -- targets installed on `stable` would be invisible here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@cross

      - name: Build (cargo)
        if: matrix.use-cross != true
        run: cargo build --release --locked -p keke-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --locked -p keke-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          archive="${BIN_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C target/${{ matrix.target }}/release "${BIN_NAME}"
          echo "ASSET=$archive" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          archive="${BIN_NAME}-${{ matrix.target }}.zip"
          7z a "$archive" "./target/${{ matrix.target }}/release/${BIN_NAME}.exe"
          echo "ASSET=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Stage binary for npm (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }} npm/${{ matrix.npm-dir }}/${{ env.BIN_NAME }}

      - name: Stage binary for npm (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe npm/${{ matrix.npm-dir }}/${{ env.BIN_NAME }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.npm-dir }}
          path: npm/${{ matrix.npm-dir }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "${{ env.BIN_NAME }}-*"
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          path: npm
          pattern: "npm-*"
          merge-multiple: false

      - name: Flatten downloaded artifacts into npm/<dir>
        run: |
          for d in npm/npm-*; do
            target="npm/$(basename "$d" | sed 's/^npm-//')"
            mkdir -p "$target"
            cp -r "$d"/* "$target"/
            rm -rf "$d"
          done
          chmod +x npm/*/${{ env.BIN_NAME }} 2>/dev/null || true

      - name: Sync npm package versions to the tag
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for f in package.json npm/*/package.json; do
            node -e '
              const fs = require("fs");
              const path = process.argv[1];
              const ver = process.argv[2];
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              pkg.version = ver;
              if (pkg.optionalDependencies) {
                for (const dep of Object.keys(pkg.optionalDependencies)) {
                  pkg.optionalDependencies[dep] = ver;
                }
              }
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            ' "$f" "$ver"
          done

      - name: Publish platform packages
        run: |
          for d in npm/*/; do
            (cd "$d" && npm publish --access public)
          done

      - name: Publish main package
        run: npm publish --access public
