[package]
name = "keke-cli"
description = "A multi-vendor terminal coding agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "keke"
path = "src/main.rs"

[dependencies]
keke-acp = { workspace = true }
keke-tui = { workspace = true }
keke-auth-api = { workspace = true }
keke-auth-codex = { workspace = true }
keke-auth-grok = { workspace = true }
keke-config = { workspace = true }
keke-config-types = { workspace = true }
keke-core = { workspace = true }
keke-credentials = { workspace = true }
keke-paths = { workspace = true }
keke-plugin-api = { workspace = true }
keke-protocol = { workspace = true }
keke-provider-api = { workspace = true }
keke-provider-grok = { workspace = true }
keke-tools = { workspace = true }
keke-wire = { workspace = true }
keke-workspace = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
[dev-dependencies]
agent-client-protocol = { workspace = true }
keke-test-support = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
