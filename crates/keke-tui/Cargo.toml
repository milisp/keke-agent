[package]
name = "keke-tui"
description = "The terminal interface: an ACP client rendered with ratatui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
keke-acp = { workspace = true }
keke-auth-api = { workspace = true }
keke-oauth = { workspace = true }
keke-config = { workspace = true }
keke-config-types = { workspace = true }
keke-fuzzy-file-search = { workspace = true }
keke-paths = { workspace = true }
keke-protocol = { workspace = true }
keke-provider-api = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "5b74652" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
