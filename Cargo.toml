[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/milisp/keke-agent"

[workspace.dependencies]
# --- tier 0: contract crates (keep these dependency-light) ---
keke-auth-api = { path = "crates/keke-auth-api", version = "0.1.1" }
keke-config-types = { path = "crates/keke-config-types", version = "0.1.1" }
keke-paths = { path = "crates/keke-paths", version = "0.1.1" }
keke-plugin-api = { path = "crates/keke-plugin-api", version = "0.1.1" }
keke-protocol = { path = "crates/keke-protocol", version = "0.1.1" }
keke-provider-api = { path = "crates/keke-provider-api", version = "0.1.1" }
keke-tool = { path = "crates/keke-tool", version = "0.1.1" }
keke-wire = { path = "crates/keke-wire", version = "0.1.1" }

# --- tier 1: engine ---
keke-acp = { path = "crates/keke-acp", version = "0.1.1" }
keke-config = { path = "crates/keke-config", version = "0.1.1" }
keke-core = { path = "crates/keke-core", version = "0.1.1" }
keke-credentials = { path = "crates/keke-credentials", version = "0.1.1" }
keke-workspace = { path = "crates/keke-workspace", version = "0.1.1" }

# --- tier 2: plugins ---
keke-auth-codex = { path = "crates/keke-auth-codex", version = "0.1.1" }
keke-hooks = { path = "crates/keke-hooks", version = "0.1.1" }
keke-mcp = { path = "crates/keke-mcp", version = "0.1.1" }
keke-skills = { path = "crates/keke-skills", version = "0.1.1" }
keke-auth-grok = { path = "crates/keke-auth-grok", version = "0.1.1" }
keke-plugin = { path = "crates/keke-plugin", version = "0.1.1" }
keke-provider-grok = { path = "crates/keke-provider-grok", version = "0.1.1" }
keke-test-support = { path = "crates/keke-test-support", version = "0.1.1" }
keke-tools = { path = "crates/keke-tools", version = "0.1.1" }
keke-tui = { path = "crates/keke-tui", version = "0.1.1" }

# --- third-party ---
# `unstable_protocol_v2` for `session/resume`'s `replayFrom`: v2 folded v1's
# `session/load` into resume, and the cursor is the only thing that says whether
# the client wants the transcript replayed or just the session back.
agent-client-protocol = { version = "2", features = ["unstable_protocol_v2"] }
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
base64 = "0.22"
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
eventsource-stream = "0.2"
futures = "0.3"
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
rand = "0.9"
ratatui = "0.29"
regex = "1"
# `socks` and `macos-system-configuration` are what make a proxy work: without
# them a deployment behind a SOCKS proxy, or one whose proxy is set in macOS
# System Settings rather than in the environment, cannot reach an issuer at all —
# and a token endpoint that cannot be reached looks exactly like a credential
# that cannot be renewed.
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "macos-system-configuration", "rustls-tls", "socks", "stream"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
# `Tool::execute` returns `impl Future`; the RPITIT-over-async_trait rule in
# AGENTS.md depends on this staying allowed.
async_fn_in_trait = "allow"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
